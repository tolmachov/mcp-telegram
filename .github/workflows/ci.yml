name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Runs on Linux, so the macOS Keychain-backed secret tests take their
      # file-store (!darwin) path and don't prompt. Integration tests are
      # behind the `integration` build tag and are excluded here.
      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      # Pin golangci-lint to a v2 release built with Go 1.26. "latest" on the
      # old action major resolved to a v1 build (Go 1.24) that refuses to load a
      # go 1.26 module ("build Go version lower than targeted"). The action major
      # must be v9+ — v8 and earlier still run on the deprecated Node 20.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
