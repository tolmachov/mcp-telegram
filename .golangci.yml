version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - errorlint
    - wrapcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gosec
    - unconvert
    - unparam

  settings:
    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        # Returning ctx.Err() verbatim is idiomatic — callers match it with
        # errors.Is(err, context.Canceled/DeadlineExceeded), and wrapping would
        # only obscure that. Likewise a bare io.Writer.Write error inside a
        # custom writer carries no useful extra context.
        - .Err(
        - .Write(
      ignore-package-globs:
        - github.com/tolmachov/mcp-telegram/*

    gosec:
      excludes:
        - G104

    misspell:
      locale: US
      # The codebase is written in British English, and "cancelled" is also the
      # literal MCP protocol method name (notifications/cancelled). Whitelist
      # those spellings so misspell still catches genuine typos.
      ignore-rules:
        - behaviour
        - cancelled
        - cancelling
        - centralised
        - defence
        - finalised
        - finalises
        - finalising
        - honouring
        - honours
        - initialise
        - initialising
        - marshalled
        - marshalling
        - minimise
        - recognisable
        - recognised
        - recognises
        - sanitise
        - serialisation
        - serialise
        - serialised
        - serialises
        - serialising
        - summarise
        - summarises
        - summarising
        - synchronise
        - synchronised
        - unrecognised

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
